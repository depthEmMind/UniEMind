[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uniemind"
version = "0.1.0"
description = "A unified, modular intelligence platform for embodied robots"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "UniEMind Contributors"}]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/agent",
  "src/algorithms",
  "src/config",
  "src/core",
  "src/data",
  "src/execution",
  "src/interaction",
  "src/memory",
  "src/monitoring",
  "src/observability",
  "src/perception",
  "src/plugins",
  "src/ros2",
  "src/safety",
  "src/schema",
  "src/session",
  "src/simulation",
  "src/skills",
  "src/tools",
  "src/world_model",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:launch_testing -p no:launch_pytest -p no:launch_ros -p no:ament_flake8 -p no:ament_xmllint -p no:ament_pep257 -p no:ament_lint -p no:ament_copyright"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["src"]
